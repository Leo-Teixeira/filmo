
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-filmo}:${POSTGRES_PASSWORD:-filmo_dev}@db:5432/${POSTGRES_DB:-filmo}?schema=public
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9229:9229"
    volumes:
      - ./api:/app
      - api-node-modules:/app/node_modules

volumes:
  api-node-modules:
