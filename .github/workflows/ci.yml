name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main: every merged commit must get a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: filmo
          POSTGRES_PASSWORD: filmo_ci
          POSTGRES_DB: filmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://filmo:filmo_ci@localhost:5432/filmo?schema=public

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      # Throwaway per-run secret: the app refuses to boot without JWT_SECRET.
      - name: Generate ephemeral JWT secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Lint
        run: pnpm exec eslint "{src,test}/**/*.ts"
      - run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Apply migrations
        run: pnpm db:deploy
      - name: E2E tests
        run: pnpm test:e2e
        env:
          # The Prisma 7 client uses a dynamic import that Jest only supports with VM modules.
          NODE_OPTIONS: --experimental-vm-modules

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get --enforce-lockfile
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
